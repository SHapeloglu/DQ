<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Anomali Dashboard — DQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#f8f9fa; }
    .passed { color: #198754; font-weight:600; }
    .failed { color: #dc3545; font-weight:600; }
    .badge-anomaly { background:#6f42c1; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>🔍 Anomali Dashboard</h2>
    <a href="/" class="btn btn-outline-secondary btn-sm">← Ana Sayfa</a>
  </div>

  <div class="row mb-3">
    <div class="col-md-4">
      <select id="sourceFilter" class="form-select" onchange="loadData()">
        <option value="">Tüm Kaynaklar</option>
      </select>
    </div>
    <div class="col-md-2">
      <select id="statusFilter" class="form-select" onchange="filterTable()">
        <option value="">Tümü</option>
        <option value="failed">Sadece Başarısız</option>
        <option value="passed">Sadece Başarılı</option>
      </select>
    </div>
    <div class="col-md-2 ms-auto text-end">
      <span id="summary" class="text-muted small"></span>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Geçen / Başarısız Dağılım</h6>
          <canvas id="pieChart" height="160"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Kontrol Tipi Dağılımı</h6>
          <canvas id="typeChart" height="160"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-sm mb-0" id="resultTable">
        <thead class="table-dark">
          <tr>
            <th>Kontrol Adı</th>
            <th>Durum</th>
            <th>Gerçek Değer</th>
            <th>Beklenen</th>
            <th>Yöntem</th>
            <th>Skor</th>
            <th>Mesaj</th>
            <th>Çalışma Zamanı</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" class="text-center text-muted py-3">Yükleniyor…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let allRows = [];
let pieChart, typeChart;

async function loadSources() {
  const res = await fetch('/sources');
  const data = await res.json();
  const sel = document.getElementById('sourceFilter');
  (data.sources || data).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.text = s.name;
    sel.appendChild(o);
  });
}

async function loadData() {
  const sid = document.getElementById('sourceFilter').value;
  const url = '/api/anomaly-results' + (sid ? '?source_id=' + sid : '');
  const res = await fetch(url);
  const data = await res.json();
  allRows = data.results || [];
  renderTable(allRows);
  renderCharts(allRows);
  document.getElementById('summary').textContent = `Toplam: ${data.count} kayıt`;
}

function filterTable() {
  const f = document.getElementById('statusFilter').value;
  const filtered = allRows.filter(r => {
    if (f === 'failed') return !r.passed;
    if (f === 'passed') return r.passed;
    return true;
  });
  renderTable(filtered);
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-3">Kayıt bulunamadı</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const msg = r.message ?? '';
    const method = msg.includes('tahmin=') ? '<span class="badge bg-info text-dark">Holt-Winters</span>'
                 : msg.includes('z=')      ? '<span class="badge bg-secondary">Z-score</span>'
                 : '-';
    const scoreMatch = msg.match(/(?:z|norm_score)=([0-9.]+)/);
    const score = scoreMatch ? `<span class="fw-bold">${scoreMatch[1]}</span>` : '-';
    return `
    <tr>
      <td><span class="badge badge-anomaly text-white">${r.check_name}</span></td>
      <td class="${r.passed ? 'passed' : 'failed'}">${r.passed ? '✅ OK' : '❌ FAIL'}</td>
      <td>${r.value_actual ?? '-'}</td>
      <td>${r.expected ?? '-'}</td>
      <td>${method}</td>
      <td>${score}</td>
      <td class="text-muted small">${msg}</td>
      <td class="text-muted small">${r.run_at ?? ''}</td>
    </tr>`;
  }).join('');
}

function renderCharts(rows) {
  const passed = rows.filter(r => r.passed).length;
  const failed = rows.length - passed;

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: ['Geçti', 'Başarısız'],
      datasets: [{ data: [passed, failed], backgroundColor: ['#198754','#dc3545'] }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  const typeCounts = {};
  rows.forEach(r => {
    const t = r.check_name.split('_').slice(0,2).join('_');
    typeCounts[t] = (typeCounts[t] || 0) + 1;
  });
  if (typeChart) typeChart.destroy();
  typeChart = new Chart(document.getElementById('typeChart'), {
    type: 'bar',
    data: {
      labels: Object.keys(typeCounts),
      datasets: [{ label: 'Sayı', data: Object.values(typeCounts), backgroundColor: '#6f42c1' }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

loadSources().then(() => loadData());
</script>
</body>
</html>
