<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Distribution Check — DQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#f8f9fa; }
    .passed { color: #198754; font-weight:600; }
    .failed { color: #dc3545; font-weight:600; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>📊 Distribution Check Dashboard</h2>
    <a href="/" class="btn btn-outline-secondary btn-sm">← Ana Sayfa</a>
  </div>

  <div class="row mb-3">
    <div class="col-md-4">
      <select id="sourceFilter" class="form-select" onchange="loadData()">
        <option value="">Tüm Kaynaklar</option>
      </select>
    </div>
    <div class="col-md-2">
      <select id="statusFilter" class="form-select" onchange="filterTable()">
        <option value="">Tümü</option>
        <option value="failed">Sadece Başarısız</option>
        <option value="passed">Sadece Başarılı</option>
      </select>
    </div>
    <div class="col-md-3 ms-auto text-end align-self-center">
      <span id="summary" class="text-muted small"></span>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Geçen / Başarısız</h6>
          <canvas id="pieChart" height="180"></canvas>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h6 class="card-title">Beklenen vs Gerçek Ortalama (Son 10)</h6>
          <canvas id="barChart" height="180"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-sm mb-0">
        <thead class="table-dark">
          <tr>
            <th>Kontrol Adı</th>
            <th>Durum</th>
            <th>Gerçek (avg,std)</th>
            <th>Beklenen</th>
            <th>Mesaj</th>
            <th>Çalışma Zamanı</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="text-center text-muted py-3">Yükleniyor…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let allRows = [];
let pieChart, barChart;

async function loadSources() {
  const res = await fetch('/sources');
  const data = await res.json();
  const sel = document.getElementById('sourceFilter');
  (data.sources || data).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.text = s.name;
    sel.appendChild(o);
  });
}

async function loadData() {
  const sid = document.getElementById('sourceFilter').value;
  const url = '/api/distribution-results' + (sid ? '?source_id=' + sid : '');
  const res = await fetch(url);
  const data = await res.json();
  allRows = data.results || [];
  renderTable(allRows);
  renderCharts(allRows);
  document.getElementById('summary').textContent = `Toplam: ${data.count} kayıt`;
}

function filterTable() {
  const f = document.getElementById('statusFilter').value;
  const filtered = allRows.filter(r => {
    if (f === 'failed') return !r.passed;
    if (f === 'passed') return r.passed;
    return true;
  });
  renderTable(filtered);
}

function parseActual(v) {
  if (!v) return { avg: null, std: null };
  const s = String(v);
  if (s.includes(',')) {
    const [avg, std] = s.split(',').map(Number);
    return { avg, std };
  }
  return { avg: Number(s), std: null };
}

function parseExpected(e) {
  if (!e) return { avg: null, std: null };
  const s = String(e);
  // format: "mean=X std=Y tol=Z" veya "X,Y"
  const mMatch = s.match(/mean=([\d.]+)/);
  const sMatch = s.match(/std=([\d.]+)/);
  if (mMatch) return { avg: parseFloat(mMatch[1]), std: sMatch ? parseFloat(sMatch[1]) : null };
  if (s.includes(',')) {
    const [avg, std] = s.split(',').map(Number);
    return { avg, std };
  }
  return { avg: Number(s), std: null };
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Kayıt bulunamadı</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td><span class="badge bg-warning text-dark">${r.check_name}</span></td>
      <td class="${r.passed ? 'passed' : 'failed'}">${r.passed ? '✅ OK' : '❌ FAIL'}</td>
      <td>${r.value_actual ?? '-'}</td>
      <td>${r.expected ?? '-'}</td>
      <td class="text-muted small">${r.message ?? ''}</td>
      <td class="text-muted small">${r.run_at ?? ''}</td>
    </tr>
  `).join('');
}

function renderCharts(rows) {
  const passed = rows.filter(r => r.passed).length;
  const failed = rows.length - passed;

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: ['Geçti', 'Başarısız'],
      datasets: [{ data: [passed, failed], backgroundColor: ['#198754','#dc3545'] }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
  });

  const last10 = rows.slice(0, 10).reverse();
  const labels = last10.map(r => r.check_name.substring(0, 15));
  const actualAvgs = last10.map(r => parseActual(r.value_actual).avg);
  const expectedAvgs = last10.map(r => parseExpected(r.expected).avg);

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Gerçek Ort.', data: actualAvgs, backgroundColor: 'rgba(13,110,253,0.7)' },
        { label: 'Beklenen Ort.', data: expectedAvgs, backgroundColor: 'rgba(255,193,7,0.7)' }
      ]
    },
    options: {
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { beginAtZero: false } }
    }
  });
}

loadSources().then(() => loadData());
</script>
</body>
</html>
