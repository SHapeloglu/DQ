services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  dq-db:
    image: mysql:8.0
    container_name: dq-db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: dq
    env_file:
      - .env
      - secrets/.env.secrets
    ports:
      - "3308:3306"
    volumes:
      - dq-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DQ Web UI ──────────────────────────────────────────────────────────────
  dq-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dq-web
    restart: always
    depends_on:
      dq-db:
        condition: service_healthy
    env_file:
      - .env
      - secrets/.env.secrets
    secrets:
      - DB_PASSWORD
      - METRICS_PG_DSN
      - METRICS_PG_PASSWORD
      - ALERT_SMTP_PASS
      - ALERT_SLACK_WEBHOOK
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dags:/app/dags

secrets:
  DB_PASSWORD:
    file: ./secrets/files/DB_PASSWORD
  METRICS_PG_DSN:
    file: ./secrets/files/METRICS_PG_DSN
  METRICS_PG_PASSWORD:
    file: ./secrets/files/METRICS_PG_PASSWORD
  ALERT_SMTP_PASS:
    file: ./secrets/files/ALERT_SMTP_PASS
  ALERT_SLACK_WEBHOOK:
    file: ./secrets/files/ALERT_SLACK_WEBHOOK

volumes:
  dq-mysql-data:
