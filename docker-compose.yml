services:

  # ── DQ Web UI ──────────────────────────────────────────────────────────────
  dq-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dq-web
    restart: always
    env_file:
      - .env
      - secrets/.env.secrets
    secrets:
      - DB_PASSWORD
      - METRICS_PG_DSN
      - METRICS_PG_PASSWORD
      - ALERT_SMTP_PASS
      - ALERT_SLACK_WEBHOOK
    ports:
      - "8002:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ortak-db
    volumes:
      - ./dags:/app/dags

secrets:
  DB_PASSWORD:
    file: ./secrets/files/DB_PASSWORD
  METRICS_PG_DSN:
    file: ./secrets/files/METRICS_PG_DSN
  METRICS_PG_PASSWORD:
    file: ./secrets/files/METRICS_PG_PASSWORD
  ALERT_SMTP_PASS:
    file: ./secrets/files/ALERT_SMTP_PASS
  ALERT_SLACK_WEBHOOK:
    file: ./secrets/files/ALERT_SLACK_WEBHOOK

# 2026-10-18: veritabanı artık ortak MySQL (mysql-ortak, ağ ortak-db). Eski dq-db servisi/volume'ü (dq_docker_dq-mysql-data) yedek olarak duruyor.
networks:
  ortak-db:
    external: true
