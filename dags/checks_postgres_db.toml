# PostgreSQL veri kalitesi kontrolleri

[source]
type = "postgres"
host = "localhost"
port = 5432
database = "dq_test"
user = "postgres"
password = "postgres"
table = "source"

[checks]
# Satır sayısı kontrolü
row_count = "SELECT COUNT(*) as cnt FROM {table}"
row_count.assertion = { ">=" = 0 }

# NULL kontrolü
null_check = "SELECT COUNT(*) as cnt FROM {table} WHERE id IS NULL"
null_check.assertion = { "=" = 0 }

[output]
format = "json"
